[project]
name = "reconnect"
version = "0.1.0"
description = "Personal networking CRM for reconnecting with contacts"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0.0",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "apify-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconnect"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
